<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0d3b3a"/>
    </linearGradient>
    <linearGradient id="curveFast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="none"/>

  <!-- subtle grid dots -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="80" cy="60" r="2"/><circle cx="180" cy="60" r="2"/><circle cx="280" cy="60" r="2"/>
    <circle cx="80" cy="160" r="2"/><circle cx="180" cy="160" r="2"/>
    <circle cx="80" cy="480" r="2"/><circle cx="180" cy="480" r="2"/>
  </g>

  <!-- Eyebrow tag -->
  <rect x="64" y="86" width="300" height="34" rx="17" fill="#22d3ee" opacity="0.14"/>
  <text x="84" y="109" fill="#5eead4" font-size="17" font-weight="700" letter-spacing="1.5">RL FOR ROBOTICS · LfD</text>

  <!-- Title -->
  <text x="62" y="220" fill="#ffffff" font-size="118" font-weight="800" letter-spacing="-2">XQCfD</text>

  <!-- Subtitle -->
  <text x="66" y="276" fill="#e2e8f0" font-size="21" font-weight="600">Accelerating Fast Actor-Critic Algorithms</text>
  <text x="66" y="308" fill="#94a3b8" font-size="21" font-weight="600">with Prior Data and Prior Policies</text>

  <!-- Authors -->
  <text x="66" y="368" fill="#cbd5e1" font-size="19">Palenicek, Vogt, Watson, Posner, Kragic, Peters</text>

  <!-- meta chips -->
  <g font-size="16" font-weight="600">
    <rect x="64" y="400" width="138" height="32" rx="16" fill="#ffffff" opacity="0.08"/>
    <text x="84" y="421" fill="#e2e8f0">Demonstrations</text>
    <rect x="214" y="400" width="148" height="32" rx="16" fill="#ffffff" opacity="0.08"/>
    <text x="234" y="421" fill="#e2e8f0">Manipulation</text>
  </g>

  <text x="66" y="492" fill="#64748b" font-size="17">arXiv:2605.10734</text>

  <!-- Learning-curve panel -->
  <g filter="url(#soft)">
    <rect x="588" y="118" width="312" height="304" rx="20" fill="#0b1220" stroke="#1f2937" stroke-width="1"/>
  </g>
  <!-- axes -->
  <line x1="624" y1="150" x2="624" y2="386" stroke="#334155" stroke-width="2"/>
  <line x1="624" y1="386" x2="868" y2="386" stroke="#334155" stroke-width="2"/>
  <text x="624" y="142" fill="#94a3b8" font-size="14" font-weight="600">Success rate</text>
  <text x="744" y="408" fill="#94a3b8" font-size="14" font-weight="600" text-anchor="middle">Environment steps</text>

  <!-- baseline (slow) curve -->
  <path d="M624 384 C 700 380, 760 360, 868 300" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <!-- XQCfD confidence band -->
  <path d="M624 384 C 660 300, 690 200, 868 174 L 868 200 C 690 232, 664 320, 624 384 Z" fill="url(#band)"/>
  <!-- XQCfD fast curve -->
  <path d="M624 384 C 658 312, 688 188, 868 168" fill="none" stroke="url(#curveFast)" stroke-width="5" stroke-linecap="round"/>

  <!-- legend -->
  <circle cx="640" cy="166" r="5" fill="#34d399"/>
  <text x="652" y="171" fill="#e2e8f0" font-size="15" font-weight="700">XQCfD</text>
  <circle cx="640" cy="190" r="5" fill="#f59e0b"/>
  <text x="652" y="195" fill="#94a3b8" font-size="15">prior work</text>
</svg>
